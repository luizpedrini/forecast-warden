[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecast-warden"
version = "0.1.0"
description = "Rule-based CLI for forecast pipeline ops: synthetic metrics → detectors → Forecast Incident → human resolve"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Luiz Dionisio Pedrini" }]
keywords = ["forecast", "ops", "anomaly", "incident", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
warden = "forecast_warden.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_warden"]

[tool.hatch.build.targets.sdist]
include = ["src/forecast_warden", "README.md", "LICENSE", "SPEC.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
